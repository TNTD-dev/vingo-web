openapi: 3.1.0
info:
  title: Vingo Booking API
  version: 1.0.0
  description: |
    API của hệ thống đặt vé sự kiện qua chat Vingo.

    Quy ước chung
    - Base URL: /api/v1. JSON UTF-8.
    - Auth: `Authorization: Bearer <access_token>` (JWT 15 phút). Refresh token xoay vòng qua /auth/refresh.
    - Vai trò: BUYER, ADMIN. Endpoint /admin/* chỉ cho ADMIN.
    - Tiền là số nguyên VND. Thời gian ISO 8601 UTC.
    - Lỗi trả `application/problem+json` (RFC 9457) kèm trường `code`.
    - `Idempotency-Key` (UUID) bắt buộc với các thao tác giữ ghế, tạo thanh toán, xử lý đơn lỗi (resolve-review).
      Cùng key + cùng body → trả lại kết quả cũ. Cùng key + khác body → 409 IDEMPOTENCY_CONFLICT.
    - Phân trang bằng cursor: `?cursor=&limit=` → `{ data, next_cursor }`.
    - Agent tool gọi chính các endpoint này bằng token của người dùng; không có API riêng cho agent.
servers:
  - url: https://api.vingo.example/api/v1
tags:
  - name: Auth
  - name: Me
  - name: Realtime
  - name: Search
  - name: Booking
  - name: Payment
  - name: Tickets
  - name: Check-in
  - name: Chat
  - name: Admin Catalog
  - name: Admin Operations
  - name: Admin Reports
security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ Auth
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Đăng ký, tạo user UNVERIFIED và gửi OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Đã gửi OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSession' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email hoặc SĐT đã tồn tại (code EMAIL_TAKEN, PHONE_TAKEN)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Xác thực OTP, kích hoạt tài khoản và cấp token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_session_id, otp]
              properties:
                otp_session_id: { type: string, format: uuid }
                otp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400':
          description: OTP sai hoặc hết hạn (OTP_INVALID, OTP_EXPIRED, OTP_TOO_MANY_ATTEMPTS)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/otp/resend:
    post:
      operationId: resendOtp
      tags: [Auth]
      summary: Gửi lại OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_session_id]
              properties:
                otp_session_id: { type: string, format: uuid }
      responses:
        '202': { description: Đã gửi lại }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Đăng nhập bằng email/SĐT và mật khẩu
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Email hoặc số điện thoại }
                password: { type: string, format: password }
                device: { type: string, description: Tên thiết bị để quản lý phiên }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: Sai thông tin (INVALID_CREDENTIALS)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '423':
          description: Tài khoản bị khoá tạm vì sai nhiều lần (ACCOUNT_LOCKED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/google:
    post:
      operationId: loginWithGoogle
      tags: [Auth]
      summary: Đăng nhập bằng Google id_token (tạo user ACTIVE nếu chưa có)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: startGoogleLogin
      tags: [Auth]
      summary: Bắt đầu đăng nhập Google
      description: Mở đường dẫn bằng trình duyệt để chuyển tới Google. Google sẽ gọi callback đã đăng ký.
      security: []
      responses:
        '302': { description: Chuyển hướng tới Google }
        '404': { $ref: '#/components/responses/GoogleLoginDisabled' }
        '429':
          description: Vượt giới hạn bắt đầu đăng nhập Google theo IP
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Gọi quá nhanh, status: 429, code: RATE_LIMITED, detail: Thử lại sau 20 giây }
        '503':
          description: Kho giới hạn tần suất tạm thời không khả dụng
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Dịch vụ tạm thời không khả dụng, status: 503, code: SERVICE_UNAVAILABLE, detail: Tạm thời không thể bắt đầu đăng nhập Google }
  /auth/oauth2/callback/google:
    get:
      operationId: completeGoogleLogin
      tags: [Auth]
      summary: Nhận callback từ Google
      description: Spring Security xử lý callback. Thành công đặt cookie refresh HttpOnly và chuyển về web với google_login=created hoặc google_login=success. Thất bại chuyển về web với google_login=failed hoặc google_login=email_taken.
      security: []
      responses:
        '302': { description: Chuyển hướng về web }
        '404': { $ref: '#/components/responses/GoogleLoginDisabled' }
  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Cấp access token và xoay vòng refresh token
      description: Trình duyệt gửi cookie refresh và Origin của web. Client khác có thể gửi refresh_token trong JSON. Với cookie, refresh token mới chỉ được gửi qua Set-Cookie.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResult' }
        '400':
          description: Body JSON thiếu refresh_token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Dữ liệu không hợp lệ, status: 400, code: VALIDATION_ERROR, detail: Có trường không hợp lệ }
        '401':
          description: Thiếu refresh token hoặc refresh token không hợp lệ
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Chưa đăng nhập, status: 401, code: UNAUTHORIZED, detail: Refresh token không hợp lệ hoặc đã hết hạn }
        '403':
          description: Origin gửi cookie refresh không được phép
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Không có quyền, status: 403, code: FORBIDDEN, detail: Origin không được phép làm mới phiên }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Đăng xuất phiên hiện tại hoặc tất cả thiết bị
      description: Thu hồi refresh token của phiên trong access token, hoặc tất cả phiên của user. Xoá cookie refresh trên trình duyệt.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                all_devices: { type: boolean, default: false }
      responses:
        '204': { description: Đã thu hồi phiên }
        '401':
          description: Thiếu hoặc sai bearer access token
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Chưa đăng nhập, status: 401, code: UNAUTHORIZED, detail: Thiếu hoặc sai access token }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      tags: [Auth]
      summary: Yêu cầu OTP đặt lại mật khẩu (luôn trả 202 để không lộ email tồn tại)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Nếu email tồn tại, OTP đã được gửi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpSession' }
  /auth/password/reset:
    post:
      operationId: resetPassword
      tags: [Auth]
      summary: Đặt mật khẩu mới bằng OTP, thu hồi mọi phiên
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp_session_id, otp, new_password]
              properties:
                otp_session_id: { type: string, format: uuid }
                otp: { type: string, pattern: '^[0-9]{6}$' }
                new_password: { type: string, minLength: 8 }
      responses:
        '204': { description: Đã đổi mật khẩu }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ------------------------------------------------------------------ Me
  /me:
    get:
      operationId: getMe
      tags: [Me]
      summary: Thông tin tài khoản hiện tại
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    patch:
      operationId: updateMe
      tags: [Me]
      summary: Sửa tên, số điện thoại hoặc đổi mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                phone: { type: string }
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteMe
      tags: [Me]
      summary: Xoá tài khoản (soft-delete) và thu hồi mọi phiên
      responses:
        '204': { description: Đã xoá }
  /me/profile:
    get:
      operationId: getBuyerProfile
      tags: [Me]
      summary: Hồ sơ người mua dùng để điền sẵn khi thanh toán
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyerProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putBuyerProfile
      tags: [Me]
      summary: Tạo hoặc cập nhật hồ sơ người mua
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuyerProfile' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BuyerProfile' }
  /me/stream:
    get:
      operationId: streamMyEvents
      tags: [Realtime]
      summary: Server-Sent Events cho người dùng hiện tại
      description: |
        Sự kiện: order.held, order.paid, order.expired, order.needs_review, payment.failed,
        ticket.issued, chat.delta, chat.block, chat.done. Chỉ nhận sự kiện của chính người dùng đang đăng nhập.
        Gửi header Authorization: Bearer <access_token>; trên trình duyệt dùng fetch vì EventSource
        không gửi được header Authorization. Không đưa token lên query string.
        Nối lại kèm header Last-Event-ID để phát lại sự kiện trong cửa sổ 5 phút, có độ lùi 10 giây:
        sự kiện có thể trùng, client tự khử trùng theo id; không phát lại chính id đã gửi trong header.
        Last-Event-ID hỏng, không phải UUID, không tồn tại, của người khác hoặc quá 5 phút
        đều không gây lỗi: phát lại toàn bộ cửa sổ 5 phút của chính người dùng.
        Không gửi Last-Event-ID thì không phát lại (sự kiện commit sát lúc kết nối vẫn có thể tới);
        client mở stream trước rồi mới tải trạng thái hiện tại bằng REST.
        Server gửi SSE comment ping khoảng mỗi 20 giây để giữ kết nối.
        Stream đóng khi token hết hạn hoặc khi mở quá 5 kết nối cùng user (đóng kết nối cũ nhất);
        client nối lại, dùng token mới nếu token đã hết hạn.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Id sự kiện cuối client đã nhận.
          schema: { type: string }
      responses:
        '200':
          description: Luồng SSE
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StreamEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------------ Search
  /events:
    get:
      operationId: searchEvents
      tags: [Search]
      summary: Tìm kiếm sự kiện đã PUBLISHED
      description: |
        Gọi khi người dùng muốn tìm sự kiện theo từ khoá, loại, thành phố, khoảng thời gian hoặc khoảng giá. Trả danh sách `EventSummary` phân trang bằng cursor.

        Phạm vi kết quả: chỉ sự kiện PUBLISHED còn ít nhất một suất SCHEDULED chưa diễn ra. Tìm theo `q` chịu được gõ không dấu và gõ sai chính tả. Nếu không sự kiện nào khớp đủ mọi từ trong `q`, trả các sự kiện khớp một phần, xếp theo độ khớp.
        `venue_name`, `city`, `first_starts_at` lấy từ suất sớm nhất thoả bộ lọc. `price_from` là giá thấp nhất trong các hạng vé đã gán khu.

        Sắp xếp (`sort`): không truyền thì có `q` dùng `relevance`, không có `q` dùng `starts_at`. `relevance` mà không có `q` trả 400.
        `popularity` = tổng vé đã bán của các suất sắp tới.

        Cursor gắn với bộ lọc và `sort` đã dùng khi sinh ra nó. Dùng cursor với bộ lọc hoặc sort khác trả 400 `VALIDATION_ERROR`.

        `city` là mã thành phố (`CityCode`), không phải tên. Người dùng nói "Sài Gòn" thì agent tự đổi sang `HCM` theo mô tả của `CityCode`.

        Ví dụ lỗi 400:
        ```json
        { "title": "Tham số không hợp lệ", "status": 400, "code": "VALIDATION_ERROR",
          "detail": "sort=relevance cần có tham số q",
          "errors": [ { "field": "sort", "message": "relevance chỉ dùng khi có q" } ] }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters:
        - name: q
          in: query
          description: "Tên sự kiện, nghệ sĩ hoặc đội. Không đưa loại sự kiện (dùng `category`), thành phố (dùng `city`) hay thời gian (dùng `from`/`to`) vào đây. Ví dụ: người dùng nói 'concert Sơn Tùng ở Sài Gòn' → `q=Sơn Tùng`, `category=CONCERT`, `city=HCM`."
          schema: { type: string }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/EventCategory' } }
        - { name: city, in: query, schema: { $ref: '#/components/schemas/CityCode' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: price_min, in: query, schema: { type: integer, format: int64 } }
        - { name: price_max, in: query, schema: { type: integer, format: int64 } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, starts_at, price, popularity] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/EventSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /events/{event_id}:
    get:
      operationId: getEvent
      tags: [Search]
      summary: Chi tiết sự kiện, địa điểm và bảng giá
      description: |
        Gọi khi đã biết `event_id` (lấy từ `searchEvents`) và cần mô tả, địa điểm, bảng giá các hạng vé và các suất. Trả `EventDetail`.
        Sự kiện không tồn tại hoặc chưa PUBLISHED trả 404.

        Ví dụ lỗi 404:
        ```json
        { "title": "Không tìm thấy sự kiện", "status": 404, "code": "NOT_FOUND", "detail": "Sự kiện không tồn tại" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /events/{event_id}/showtimes:
    get:
      operationId: listEventShowtimes
      tags: [Search]
      summary: Danh sách suất của sự kiện
      description: |
        Gọi khi cần liệt kê các suất của một sự kiện để người dùng chọn ngày giờ. Trả `data` là danh sách `Showtime` kèm `status` tính theo thời điểm gọi.
        Sự kiện không tồn tại trả 404.

        Ví dụ lỗi 404:
        ```json
        { "title": "Không tìm thấy sự kiện", "status": 404, "code": "NOT_FOUND", "detail": "Sự kiện không tồn tại" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Showtime' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /showtimes/{showtime_id}/seatmap:
    get:
      operationId: getSeatmap
      tags: [Search]
      summary: Sơ đồ ghế theo suất kèm hạng, giá và trạng thái
      description: |
        Gọi khi người dùng cần chọn ghế cụ thể. Trả sơ đồ ghế của suất kèm hạng vé, giá và trạng thái từng ghế. Có thể cache vài giây.

        Không truyền `zone_id` thì trả mọi khu; truyền `zone_id` thì chỉ trả khu đó. `zone_id` không thuộc sơ đồ của suất trả 404.
        Ghế HELD đã quá `held_until` được trả là AVAILABLE. Ghế thiếu dữ liệu trạng thái được trả là BLOCKED.

        Gợi ý cho agent: gọi `getAvailability` trước để biết khu nào còn chỗ, rồi gọi seatmap theo từng khu bằng `zone_id` để giảm dữ liệu.

        Ví dụ lỗi 404 (suất hoặc khu không tồn tại):
        ```json
        { "title": "Không tìm thấy khu", "status": 404, "code": "NOT_FOUND", "detail": "zone_id không thuộc sơ đồ của suất" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters:
        - $ref: '#/components/parameters/ShowtimeId'
        - { name: zone_id, in: query, required: false, description: 'Chỉ trả khu này; bỏ trống để trả mọi khu', schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /showtimes/{showtime_id}/availability:
    get:
      operationId: getAvailability
      tags: [Search]
      summary: Số chỗ còn theo khu và hạng vé
      description: |
        Gọi khi cần biết suất còn chỗ không và khu/hạng nào còn bao nhiêu chỗ, trước khi chọn ghế hoặc tạo hold. Nhẹ hơn `getSeatmap`.
        Trả `sold_out` và danh sách khu kèm hạng vé. Suất không tồn tại trả 404.

        Ví dụ lỗi 404:
        ```json
        { "title": "Không tìm thấy suất", "status": 404, "code": "NOT_FOUND", "detail": "Suất không tồn tại" }
        ```
        Ví dụ lỗi 429 (kèm header `Retry-After`):
        ```json
        { "title": "Gọi quá nhanh", "status": 429, "code": "RATE_LIMITED", "detail": "Thử lại sau 10 giây" }
        ```
      security: []
      parameters: [ { $ref: '#/components/parameters/ShowtimeId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  showtime_id: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/ShowtimeStatus' }
                  sold_out: { type: boolean }
                  zones:
                    type: array
                    items:
                      type: object
                      properties:
                        zone_id: { type: string, format: uuid }
                        name: { type: string }
                        tier: { $ref: '#/components/schemas/PriceTier' }
                        seats_left: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ------------------------------------------------------------------ Booking
  /showtimes/{showtime_id}/holds:
    post:
      operationId: holdSeats
      tags: [Booking]
      summary: Giữ ghế 10 phút và tạo đơn PENDING (tất cả hoặc không)
      description: |
        Khu ngồi gửi seat_ids (ghế đôi tự giữ kèm ghế cặp). Khu đứng gửi zone_id + quantity.
        Đơn PENDING cũ đã quá hạn của khách cho suất này sẽ được đóng trước.
        Nếu khách đã có đơn PENDING còn hạn cho suất này → 409 ORDER_STATE_INVALID; muốn đổi ghế thì huỷ rồi giữ lại.
        Vượt max_tickets_per_order của sự kiện (tính cả ghế cặp) → 422 MAX_TICKETS_EXCEEDED.
        Suất không tồn tại hoặc DRAFT → 404 NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/ShowtimeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldRequest' }
      responses:
        '201':
          description: Đã giữ chỗ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            SEAT_TAKEN, NOT_ENOUGH_STOCK, SHOWTIME_NOT_ON_SALE, ORDER_STATE_INVALID, IDEMPOTENCY_CONFLICT.
            taken_seat_ids: ghế vừa bị giữ/bán.
            suggested_seat_ids: gợi ý ghế cùng khu, cùng số lượng, đang trống.
            seats_left: số chỗ còn lại của khu đứng (integer).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                seatTaken:
                  value:
                    type: https://vingo.example/errors/seat-taken
                    title: Ghế vừa có người giữ
                    status: 409
                    code: SEAT_TAKEN
                    taken_seat_ids: ['5b0d...']
                    suggested_seat_ids: ['9a1c...', '9a1d...']
                notEnoughStock:
                  value:
                    type: https://vingo.example/errors/not-enough-stock
                    title: Khu đứng không đủ chỗ
                    status: 409
                    code: NOT_ENOUGH_STOCK
                    seats_left: 2
        '422':
          description: MAX_TICKETS_EXCEEDED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /orders:
    get:
      operationId: listMyOrders
      tags: [Booking]
      summary: Danh sách đơn của tôi
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
  /orders/{order_id}:
    get:
      operationId: getOrder
      tags: [Booking]
      summary: Chi tiết đơn (chỉ chủ đơn)
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{order_id}/cancel:
    post:
      operationId: cancelOrder
      tags: [Booking]
      summary: Huỷ đơn PENDING và nhả ghế (đổi ghế = huỷ + giữ lại)
      description: Đơn không tồn tại hoặc của người khác → 404 NOT_FOUND.
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: Đơn đã chuyển CANCELLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ORDER_STATE_INVALID (đơn đã PAID hoặc EXPIRED)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ------------------------------------------------------------------ Payment
  /orders/{order_id}/payments:
    post:
      operationId: createPayment
      tags: [Payment]
      summary: Tạo hoặc tái dùng payment_intent OPEN và trả link VNPay
      description: |
        Điều kiện: order PENDING, expires_at > now, đã có buyer_profile.
        payment_url ký HMAC-SHA512, vnp_Amount = amount × 100, hết hạn cùng order.expires_at.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [VNPAYQR, ATM, INTCARD], description: 'Gợi ý phương thức, có thể bỏ trống' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '409':
          description: HOLD_EXPIRED, ORDER_STATE_INVALID, IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: PROFILE_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /orders/{order_id}/payment:
    get:
      operationId: getPayment
      tags: [Payment]
      summary: Trạng thái lần thanh toán gần nhất của đơn
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/vnpay/ipn:
    get:
      operationId: handleVnpayIpn
      tags: [Payment]
      summary: Webhook IPN của VNPay (nguồn sự thật duy nhất để chốt bán)
      description: |
        Kiểm vnp_SecureHash trước mọi xử lý. Lưu payment_transaction (append-only, raw).
        Xử lý idempotent theo payment_intent. Luôn trả HTTP 200 với RspCode:
        00 thành công · 01 không tìm thấy giao dịch · 02 đã xử lý · 04 sai số tiền · 97 sai chữ ký · 99 lỗi hệ thống (VNPay gọi lại).
      security: []
      parameters:
        - { name: vnp_TxnRef, in: query, required: true, schema: { type: string } }
        - { name: vnp_Amount, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: vnp_ResponseCode, in: query, required: true, schema: { type: string } }
        - { name: vnp_TransactionStatus, in: query, required: true, schema: { type: string } }
        - { name: vnp_TransactionNo, in: query, schema: { type: string } }
        - { name: vnp_SecureHash, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Phản hồi cho VNPay
          content:
            application/json:
              schema:
                type: object
                required: [RspCode, Message]
                properties:
                  RspCode: { type: string, enum: ['00', '01', '02', '04', '97', '99'] }
                  Message: { type: string }
  /payments/vnpay/return:
    get:
      operationId: handleVnpayReturn
      tags: [Payment]
      summary: Trang VNPay chuyển khách về; chỉ để hiển thị, không chốt bán
      description: Nếu chưa có IPN thì backend gọi querydr ngay, rồi chuyển hướng về cuộc chat.
      security: []
      responses:
        '302': { description: Chuyển về Chat Web App }

  # ------------------------------------------------------------------ Tickets
  /tickets:
    get:
      operationId: listMyTickets
      tags: [Tickets]
      summary: Vé của tôi
      parameters:
        - { name: when, in: query, schema: { type: string, enum: [upcoming, past], default: upcoming } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TicketStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Ticket' }
  /tickets/{ticket_id}:
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: Chi tiết vé; qr_token chỉ có khi status = ISSUED
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tickets/{ticket_id}/qr.png:
    get:
      operationId: getTicketQr
      tags: [Tickets]
      summary: Ảnh mã QR vào cổng
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '200':
          description: PNG
          content:
            image/png:
              schema: { type: string, format: binary }
        '409':
          description: Vé không còn hiệu lực (TICKET_NOT_VALID)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /tickets/{ticket_id}/resend:
    post:
      operationId: resendMyTicket
      tags: [Tickets]
      summary: Gửi lại vé tới email trên đơn (rate limit 3 lần / giờ)
      description: |
        Chỉ chủ vé được gửi lại; vé không tồn tại hoặc khác chủ đều trả 404.
        Khoá vé trước khi kiểm trạng thái; chỉ vé ISSUED được gửi. USED → TICKET_USED,
        VOID → TICKET_NOT_VALID; đơn không có buyer_email → ORDER_STATE_INVALID.
        Giới hạn 3 lần/giờ/user (RATE_LIMITED); ghi email vé qua outbox, không ghi audit_log.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '202': { description: Đã đưa vào hàng đợi gửi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TICKET_USED, TICKET_NOT_VALID hoặc ORDER_STATE_INVALID khi đơn không có email.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                used:
                  value: { title: Vé đã sử dụng, status: 409, code: TICKET_USED, detail: Chỉ gửi lại vé ISSUED. }
                void:
                  value: { title: Vé không còn hiệu lực, status: 409, code: TICKET_NOT_VALID, detail: Vé đã bị vô hiệu. }
                noEmail:
                  value: { title: Đơn không có email, status: 409, code: ORDER_STATE_INVALID, detail: Đơn không có buyer_email để gửi vé. }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ------------------------------------------------------------------ Check-in
  /checkins:
    post:
      operationId: checkIn
      tags: [Check-in]
      summary: Quét QR tại cổng
      description: Chỉ ADMIN (sau này có thể thêm vai trò nhân viên soát vé). Khoá vé theo qr_token; ISSUED và đúng suất → USED. Mọi lần quét đều ghi checkin; qr_token không tồn tại → 404, không ghi checkin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, showtime_id]
              properties:
                qr_token: { type: string }
                showtime_id: { type: string, format: uuid }
                gate: { type: string }
      responses:
        '200':
          description: Hợp lệ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }
        '409':
          description: |
            Từ chối quét, body là CheckinResult (không phải Problem):
            ALREADY_USED: vé đã quét trước đó, first_used_at là lần quét đầu.
            TICKET_VOID: vé đã huỷ.
            WRONG_SHOWTIME: vé thuộc suất khác, trạng thái vé không đổi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }
              examples:
                alreadyUsed:
                  value:
                    result: ALREADY_USED
                    ticket_code: K7M2QX9P
                    zone: VIP
                    row: B
                    number: 12
                    scanned_at: '2026-12-20T12:31:05Z'
                    first_used_at: '2026-12-20T12:05:41Z'
                ticketVoid:
                  value:
                    result: TICKET_VOID
                    ticket_code: H3WR8TNA
                    zone: GA
                    row: null
                    number: null
                    scanned_at: '2026-12-20T12:31:05Z'
                    first_used_at: null
                wrongShowtime:
                  value:
                    result: WRONG_SHOWTIME
                    ticket_code: P9DXE4LC
                    zone: VIP
                    row: C
                    number: 3
                    scanned_at: '2026-12-20T12:31:05Z'
                    first_used_at: null
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/showtimes/{showtime_id}/checkins:
    get:
      operationId: listShowtimeCheckins
      tags: [Check-in]
      summary: Lịch sử quét theo suất
      parameters:
        - $ref: '#/components/parameters/ShowtimeId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/CheckinResult' }

  # ------------------------------------------------------------------ Chat
  /chat/conversations:
    post:
      operationId: createConversation
      tags: [Chat]
      summary: Tạo cuộc hội thoại mới với agent theo vai trò
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
  /chat/conversations/{conversation_id}/messages:
    get:
      operationId: listMessages
      tags: [Chat]
      summary: Lịch sử tin nhắn và block
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
                  next_cursor: { type: [string, 'null'] }
    post:
      operationId: sendMessage
      tags: [Chat]
      summary: Gửi tin nhắn; câu trả lời stream qua /me/stream
      parameters: [ { $ref: '#/components/parameters/ConversationId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 4000 }
                block_event:
                  description: Thao tác trên block (ví dụ chọn ghế trên SeatMap) gửi kèm thay cho text
                  type: object
                  properties:
                    block_id: { type: string }
                    type: { type: string, example: seatmap.select }
                    payload: { type: object }
      responses:
        '202':
          description: Đã nhận, agent đang xử lý
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string, format: uuid }
        '429': { $ref: '#/components/responses/RateLimited' }
  /chat/actions/{action_id}/confirm:
    post:
      operationId: confirmAction
      tags: [Chat]
      summary: Duyệt một ConfirmAction do agent đề xuất
      parameters: [ { $ref: '#/components/parameters/ActionId' } ]
      responses:
        '200': { description: 'Hành động đã thực thi, kết quả gửi qua SSE' }
        '409':
          description: Action đã hết hạn hoặc đã xử lý (ACTION_STATE_INVALID)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /chat/actions/{action_id}/reject:
    post:
      operationId: rejectAction
      tags: [Chat]
      summary: Từ chối ConfirmAction
      parameters: [ { $ref: '#/components/parameters/ActionId' } ]
      responses:
        '204': { description: Đã từ chối }

  # ------------------------------------------------------------------ Admin Catalog
  /admin/venues:
    get:
      operationId: listVenues
      tags: [Admin Catalog]
      summary: Tìm / lọc sân
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Venue' }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: createVenue
      tags: [Admin Catalog]
      summary: Tạo sân
      description: Admin tạo hồ sơ sân với tên, loại, địa chỉ và mã tỉnh hoặc thành phố.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueCreateInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /admin/venues/{venue_id}:
    parameters: [ { $ref: '#/components/parameters/VenueId' } ]
    patch:
      operationId: updateVenue
      tags: [Admin Catalog]
      summary: Sửa sân
      description: Cập nhật các trường được gửi của sân đang hoạt động. Trả 400 VALIDATION_ERROR khi dữ liệu không hợp lệ, 404 NOT_FOUND khi sân không tồn tại hoặc đã ngừng sử dụng.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Venue' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteVenue
      tags: [Admin Catalog]
      summary: Ngừng sử dụng sân (soft-delete)
      description: Ngừng sử dụng sân bằng xóa mềm. Trả 404 NOT_FOUND nếu sân không tồn tại hoặc đã bị xóa; trả 409 VENUE_IN_USE nếu còn suất DRAFT hoặc SCHEDULED chưa kết thúc.
      responses:
        '204': { description: Đã ẩn }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sân còn suất chưa kết thúc (VENUE_IN_USE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Sân đang được sử dụng
                status: 409
                code: VENUE_IN_USE
                detail: Sân còn suất diễn DRAFT hoặc SCHEDULED chưa kết thúc.
  /admin/venues/{venue_id}/halls:
    post:
      operationId: createHall
      tags: [Admin Catalog]
      summary: Thêm khu vực (hall) cho sân
      description: Tạo hall trong sân đang hoạt động. Trả 400 VALIDATION_ERROR nếu tên không hợp lệ, 404 NOT_FOUND nếu sân không tồn tại hoặc đã ngừng sử dụng, 409 HALL_NAME_TAKEN nếu tên đã có trong sân.
      parameters: [ { $ref: '#/components/parameters/VenueId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hall' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Tên hall đã tồn tại trong cùng sân (HALL_NAME_TAKEN).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Tên đã bị trùng
                status: 409
                code: HALL_NAME_TAKEN
                detail: Sân này đã có hall tên Sân chính.
  /admin/halls/{hall_id}/seat-layouts:
    get:
      operationId: listSeatLayouts
      tags: [Admin Catalog]
      summary: Liệt kê phiên bản sơ đồ của hall
      description: Trả tên và phiên bản sơ đồ của hall, mới nhất trước. Chọn bằng id cụ thể khi tạo suất, không tự lấy bản mới nhất.
      parameters:
        - name: hall_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách phiên bản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayoutPage' }
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Dữ liệu không hợp lệ
                status: 400
                code: VALIDATION_ERROR
                detail: Cursor sơ đồ không hợp lệ. Hãy tải lại trang đầu và dùng next_cursor do API trả về.
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy hall thuộc sân đang hoạt động. Hãy chọn lại hall.
    post:
      operationId: createSeatLayout
      tags: [Admin Catalog]
      summary: Tải sơ đồ ghế (DRAFT)
      parameters:
        - { name: hall_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatLayoutInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayout' }
  /admin/halls/{hall_id}/seat-layouts/import:
    post:
      operationId: importSeatLayoutSvg
      tags: [Admin Catalog]
      summary: Nhập sơ đồ sân từ SVG
      description: >
        Giới hạn file 10 MiB và tổng request 11 MiB, áp dụng cho mọi profile.
        Nhập một SVG xuất từ Figma theo quy ước v1.
        File hợp lệ tạo một phiên bản sơ đồ DRAFT thuộc hall.
        Bắt buộc nhập name không trắng, tối đa 200 ký tự. Tên được bỏ khoảng trắng hai đầu.
        Các phiên bản được phép dùng cùng tên.
      parameters:
        - name: hall_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file: { type: string, format: binary }
                name: { type: string, minLength: 1, maxLength: 200, pattern: '[\s\S]*\S[\s\S]*', example: 'Concert – sân khấu đầu B' }
            encoding:
              file: { contentType: image/svg+xml }
      responses:
        '201':
          description: Đã tạo bản nháp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayout' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: File vượt 10 MiB hoặc tổng request multipart vượt 11 MiB.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Content Too Large
                status: 413
                code: VALIDATION_ERROR
                detail: Maximum upload size exceeded
        '415':
          description: Định dạng file không được hỗ trợ
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Định dạng file không được hỗ trợ
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
        '422':
          description: SVG không hợp lệ theo quy ước nhập sơ đồ
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/SeatLayoutImportProblem' }
              examples:
                duplicateSeat:
                  summary: Trùng số ghế trong cùng hàng
                  value:
                    title: Sơ đồ sân không hợp lệ
                    status: 422
                    code: INVALID_SEAT_LAYOUT
                    issues:
                      - layer_id: SEAT__B15-T1__N__29
                        reason: DUPLICATE_SEAT
                        message: Ghế 29 bị trùng trong hàng N của khu B15-T1.
                malformedXml:
                  summary: SVG có XML bị lỗi
                  value:
                    title: Sơ đồ sân không hợp lệ
                    status: 422
                    code: INVALID_SEAT_LAYOUT
                    issues:
                      - reason: MALFORMED_XML
                        message: Không đọc được cấu trúc XML. Hãy xuất lại SVG từ Figma.

  /admin/seat-layouts/{layout_id}:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: renameSeatLayout
      tags: [Admin Catalog]
      summary: Đổi tên cấu hình sơ đồ nháp
      description: Chỉ đổi tên phiên bản DRAFT thuộc sân đang hoạt động. Không đổi khu, ghế, số phiên bản hoặc liên kết của suất. Bản PUBLISHED bị khóa tên.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeatLayoutNameInput' }
      responses:
        '200':
          description: Cấu hình sơ đồ với tên mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayout' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Phiên bản đã công bố (SEAT_LAYOUT_LOCKED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Sơ đồ đã công bố, status: 409, code: SEAT_LAYOUT_LOCKED, detail: Chỉ được đổi tên sơ đồ DRAFT. }
    get:
      operationId: getSeatLayout
      tags: [Admin Catalog]
      summary: Đọc tổng quan sơ đồ sân
      description: Trả tên cấu hình, thông tin phiên bản, hệ tọa độ và danh sách khu để dựng bản đồ và mini map.
      responses:
        '200':
          description: Tổng quan sơ đồ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayoutOverview' }
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy phiên bản sơ đồ sân. Hãy tải lại danh sách sơ đồ của hall.

  /admin/seat-layouts/{layout_id}/svg:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSeatLayoutSvg
      tags: [Admin Catalog]
      summary: Đọc SVG toàn sân
      description: Trả SVG đã chuẩn hóa của phiên bản. Layout không có SVG trả 404.
      responses:
        '200':
          description: Nội dung SVG
          content:
            image/svg+xml:
              schema: { type: string, format: binary }
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy SVG của phiên bản sơ đồ. Hãy chọn phiên bản đã nhập từ SVG.

  /admin/seat-layouts/{layout_id}/zones/{zone_id}:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: zone_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSeatLayoutZone
      tags: [Admin Catalog]
      summary: Đọc chi tiết khu
      description: Trả hàng ghế hoặc sức chứa. Khu phải thuộc đúng phiên bản trong URL.
      responses:
        '200':
          description: Chi tiết khu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayoutZoneDetail' }
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy khu trong phiên bản sơ đồ đã chọn. Hãy lấy zone_id từ tổng quan của layout này.

  /admin/seat-layouts/{layout_id}/zones.csv:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportSeatLayoutZones
      tags: [Admin Catalog]
      summary: Tải danh sách khu dưới dạng CSV
      description: Xuất CSV UTF-8 với các cột zone_code, label, stand_code, level, kind, capacity, svg_id.
      responses:
        '200':
          description: Danh sách khu
          content:
            text/csv:
              schema: { type: string }
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy sơ đồ để xuất danh sách khu. Hãy chọn lại layout_id từ danh sách phiên bản.

  /admin/seat-layouts/{layout_id}/seats.csv:
    parameters:
      - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportSeatLayoutSeats
      tags: [Admin Catalog]
      summary: Tải danh sách ghế dưới dạng CSV
      description: Xuất CSV UTF-8 với các cột zone_code, row_label, seat_number, x, y. Chỉ khu SEATED có dòng ghế.
      responses:
        '200':
          description: Danh sách ghế
          content:
            text/csv:
              schema: { type: string }
        '404':
          description: Không tìm thấy dữ liệu
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Không tìm thấy dữ liệu
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy sơ đồ để xuất danh sách ghế. Hãy chọn lại layout_id từ danh sách phiên bản.
  /admin/seat-layouts/{layout_id}/publish:
    post:
      operationId: publishSeatLayout
      tags: [Admin Catalog]
      summary: Khoá sơ đồ ghế (PUBLISHED, không sửa được nữa)
      description: Chuyển phiên bản sơ đồ từ DRAFT sang PUBLISHED và ghi nhận thời điểm công bố. Gọi lại trên phiên bản đã PUBLISHED sẽ trả về cùng phiên bản và giữ nguyên published_at.
      parameters:
        - { name: layout_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatLayout' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [Admin Catalog]
      summary: Liệt kê sự kiện cho admin
      description: >
        Admin liệt kê sự kiện ở mọi trạng thái, gồm DRAFT.
        Có thể lọc theo tên, trạng thái và loại sự kiện.
        q tìm chuỗi con trong title, không phân biệt hoa thường.
        Sắp xếp created_at giảm dần, sau đó id giảm dần.
        Dùng next_cursor để đọc trang tiếp theo với cùng bộ lọc.
        Không thay đổi dữ liệu.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/EventCategory'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách sự kiện.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventPage'
        '400':
          description: Bộ lọc, cursor hoặc limit không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Dữ liệu không hợp lệ
                status: 400
                code: VALIDATION_ERROR
                detail: Cursor sự kiện không hợp lệ.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createEvent
      tags: [Admin Catalog]
      summary: Tạo sự kiện nháp
      description: >
        Admin tạo sự kiện ở trạng thái DRAFT.
        Bắt buộc title không trắng và category hợp lệ.
        Nếu không gửi max_tickets_per_order thì mặc định 10.
        Hai poster được lưu độc lập và phải là URL tuyệt đối
        dùng HTTP hoặc HTTPS khi được cung cấp.
        Thao tác này chưa tạo suất, giá hoặc tồn kho.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateInput'
      responses:
        '201':
          description: Đã tạo sự kiện DRAFT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          description: Thiếu trường bắt buộc hoặc dữ liệu không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Dữ liệu không hợp lệ
                status: 400
                code: VALIDATION_ERROR
                detail: Tên sự kiện không được để trống.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/events/{event_id}:
    get:
      operationId: getAdminEvent
      tags: [Admin Catalog]
      summary: Đọc chi tiết sự kiện cho admin
      description: >
        Admin đọc thông tin sự kiện để xem và tiếp tục chỉnh sửa.
        Trả cả sự kiện DRAFT, PUBLISHED, ENDED và CANCELLED.
        Bao gồm thông tin chung, hai poster, hạng giá và các suất,
        kể cả suất DRAFT.
        Không thay đổi trạng thái hoặc dữ liệu sự kiện.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Chi tiết sự kiện.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Không tìm thấy sự kiện.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Không tìm thấy
                status: 404
                code: NOT_FOUND
                detail: Không tìm thấy sự kiện.
    patch:
      operationId: updateEvent
      tags: [Admin Catalog]
      summary: Sửa thông tin chung của sự kiện
      description: >
        Admin sửa thông tin chung của sự kiện DRAFT hoặc PUBLISHED.
        Chỉ cập nhật trường có giá trị khác null; trường không gửi hoặc null giữ nguyên.
        attributes khác null thay thế toàn bộ object thuộc tính.
        Body rỗng là thao tác không thay đổi dữ liệu.
        Không sửa trạng thái, sơ đồ, suất, hạng giá, giá khu hoặc tồn kho qua endpoint này.
        Sự kiện ENDED hoặc CANCELLED bị khóa (EVENT_LOCKED).
        Sau khi cập nhật thành công, Search làm mới cache sau commit.
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventPatchInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '400':
          description: Tên, loại, poster, tuổi hoặc giới hạn vé không hợp lệ (VALIDATION_ERROR).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Dữ liệu không hợp lệ, status: 400, code: VALIDATION_ERROR, detail: Tên sự kiện không được để trống. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sự kiện đã kết thúc hoặc hủy (EVENT_LOCKED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Sự kiện bị khóa, status: 409, code: EVENT_LOCKED, detail: Không thể sửa sự kiện đã kết thúc hoặc hủy. }
  /admin/events/{event_id}/price-tiers:
    put:
      operationId: putPriceTiers
      tags: [Admin Catalog]
      summary: Đặt toàn bộ hạng giá của sự kiện
      description: >
        Admin đặt toàn bộ danh sách hạng giá.
        Event phải là DRAFT hoặc PUBLISHED, không có đơn
        và không có suất chưa hủy đã tới giờ mở bán.
        Nếu có id, hạng phải thuộc đúng sự kiện.
        Nếu không có id, dùng lại hạng cùng tên đã bỏ khoảng trắng,
        hoặc tạo mới nếu chưa có.
        Không chấp nhận trùng id hoặc tên.
        Hạng bị bỏ khỏi danh sách chỉ được xóa nếu không còn
        được gán khu hoặc tham chiếu bởi dòng đơn hàng.
        Mọi thay đổi trong cùng transaction; lỗi thì rollback toàn bộ.
        Search làm mới cache sau commit.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PriceTierInput'
      responses:
        '200':
          description: Đã lưu danh sách hạng giá.
        '400':
          description: Dữ liệu hạng giá hoặc tham chiếu không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Dữ liệu không hợp lệ
                status: 400
                code: VALIDATION_ERROR
                detail: Hạng giá không thuộc sự kiện hoặc tên bị trùng.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cấu hình giá đã bị khóa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Sự kiện không cho phép chỉnh sửa
                status: 409
                code: EVENT_LOCKED
                detail: Sự kiện đã bắt đầu bán, có đơn hoặc không còn cho chỉnh sửa.
  /admin/events/{event_id}/zone-prices:
    put:
      operationId: putZonePrices
      tags: [Admin Catalog]
      summary: Gán hạng vé cho từng khu (mỗi khu một hạng)
      description: >
        Admin thay toàn bộ danh sách gán hạng giá cho khu.
        Áp dụng cùng quy tắc khóa như PUT price-tiers:
        event DRAFT hoặc PUBLISHED, chưa có đơn và không có
        suất chưa hủy đã tới giờ mở bán.
        Mỗi zone_id chỉ xuất hiện một lần.
        Khu phải thuộc layout đang được suất chưa hủy của sự kiện sử dụng.
        Hạng giá phải thuộc đúng sự kiện.
        Cho phép cấu hình chưa đủ khu trước bước công bố.
        Toàn bộ thay đổi trong cùng transaction; lỗi thì rollback.
        Search làm mới cache sau commit.
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ZonePriceInput'
      responses:
        '200': { description: OK }
        '400':
          description: Dữ liệu khu hoặc tham chiếu hạng giá không hợp lệ.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Dữ liệu không hợp lệ
                status: 400
                code: VALIDATION_ERROR
                detail: Khu hoặc hạng giá không thuộc cấu hình của sự kiện.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cấu hình giá đã bị khóa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Sự kiện không cho phép chỉnh sửa
                status: 409
                code: EVENT_LOCKED
                detail: Sự kiện đã bắt đầu bán, có đơn hoặc không còn cho chỉnh sửa.
  /admin/events/{event_id}/publish:
    post:
      operationId: publishEvent
      tags: [Admin Catalog]
      summary: DRAFT → PUBLISHED; các suất chuyển SCHEDULED
      description: >
        Công bố nguyên tử sự kiện DRAFT khi có ít nhất một suất chưa hủy, layout đã công bố,
        sân còn hoạt động, thời gian suất hợp lệ và mọi khu có hạng giá thuộc sự kiện.
        Thiếu cấu hình trả 422 EVENT_INCOMPLETE. Suất DRAFT chuyển SCHEDULED;
        giữ nguyên tồn kho hiện có, kể cả BLOCKED, chỉ bổ sung dòng thiếu.
        Gửi lại sự kiện PUBLISHED trả dữ liệu hiện tại. ENDED/CANCELLED trả EVENT_LOCKED.
        Cache làm mới sau commit. Hệ thống tính ON_SALE khi tới giờ, không lưu trạng thái đó.
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: EVENT_LOCKED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Sự kiện đã khóa, status: 409, code: EVENT_LOCKED, detail: Sự kiện đã kết thúc hoặc hủy. }
        '422':
          description: Thiếu suất, thiếu giá hoặc khu chưa có hạng (EVENT_INCOMPLETE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/events/{event_id}/cancel:
    post:
      operationId: cancelEvent
      tags: [Admin Catalog]
      summary: Huỷ sự kiện (chỉ khi chưa suất nào ON_SALE)
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { description: OK }
        '409':
          description: EVENT_LOCKED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/events/{event_id}/showtimes:
    post:
      operationId: createShowtime
      tags: [Admin Catalog]
      summary: Tạo suất
      description: >
        Tạo suất diễn gắn với hall_id và seat_layout_id đã PUBLISHED thuộc đúng hall đó.
        Chọn địa điểm riêng cho từng suất, có thể dùng nhiều sân trong cùng sự kiện.
        Sự kiện phải là DRAFT hoặc PUBLISHED; trạng thái ENDED/CANCELLED trả EVENT_LOCKED.
        Tạo tồn kho của phiên bản đã chọn trong cùng transaction và làm mới cache sau commit.
      parameters: [ { $ref: '#/components/parameters/EventId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShowtimeInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Showtime' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Sự kiện đã kết thúc hoặc hủy (EVENT_LOCKED).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Sự kiện không cho phép chỉnh sửa, status: 409, code: EVENT_LOCKED, detail: Không thể thêm suất vào sự kiện đã kết thúc hoặc hủy. }
        '422':
          description: Sơ đồ sân chưa công bố hoặc không thuộc hall được chọn (INVALID_SEAT_LAYOUT)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Sơ đồ sân không hợp lệ
                status: 422
                code: INVALID_SEAT_LAYOUT
                detail: Sơ đồ sân phải ở trạng thái PUBLISHED và thuộc đúng hall đã chọn.
  /admin/showtimes/{showtime_id}:
    patch:
      operationId: updateShowtime
      tags: [Admin Catalog]
      summary: Sửa suất (chỉ trước sale_opens_at)
      description: >
        Cập nhật thông tin suất diễn trước thời điểm mở bán hiện tại, không áp default cho trường không gửi hoặc null.
        Sự kiện ENDED/CANCELLED trả EVENT_LOCKED; suất đã hủy hoặc đã tới giờ mở bán trả SHOWTIME_LOCKED.
        Nếu đổi hall_id hoặc seat_layout_id thì sơ đồ phải đã PUBLISHED và thuộc đúng hall.
        Đổi sơ đồ chỉ được khi chưa có đơn hoặc tồn kho HELD/SOLD/BLOCKED.
        Metadata, tồn kho và sự kiện làm mới cache được xử lý trong cùng transaction.
      parameters: [ { $ref: '#/components/parameters/ShowtimeId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShowtimeInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Showtime' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SHOWTIME_LOCKED hoặc EVENT_LOCKED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Suất đã mở bán, không sửa được
                status: 409
                code: SHOWTIME_LOCKED
                detail: Suất diễn đã mở bán, không thể chỉnh sửa.
        '422':
          description: Sơ đồ sân chưa công bố hoặc không thuộc hall được chọn (INVALID_SEAT_LAYOUT)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Sơ đồ sân không hợp lệ
                status: 422
                code: INVALID_SEAT_LAYOUT
                detail: Sơ đồ sân phải ở trạng thái PUBLISHED và thuộc đúng hall đã chọn.
  /admin/showtimes/{showtime_id}/cancel:
    post:
      operationId: cancelShowtime
      tags: [Admin Catalog]
      summary: Huỷ suất chưa mở bán
      parameters: [ { $ref: '#/components/parameters/ShowtimeId' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { description: OK }
        '409':
          description: SHOWTIME_LOCKED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /admin/showtimes/{showtime_id}/seats/block:
    post:
      operationId: blockSeats
      tags: [Admin Catalog]
      summary: block seats
      description: >
        ADMIN thay đổi ghế theo suất, nguyên tử toàn bộ danh sách; hỗ trợ suất DRAFT.
        AVAILABLE hoặc HELD có held_until < giờ hiện tại được khóa; HELD còn hạn và SOLD trả SEAT_TAKEN.
        Mở khóa chỉ chấp nhận BLOCKED hoặc AVAILABLE. Gửi lại trạng thái đích thành công, không ghi thêm lịch sử.
        Không tự thêm ghế cặp. Ghế ngoài sơ đồ, danh sách rỗng/trùng/null trả VALIDATION_ERROR.
        Event ENDED/CANCELLED trả EVENT_LOCKED; suất CANCELLED hoặc đã kết thúc trả SHOWTIME_LOCKED.
        Lý do khóa được lưu; dữ liệu và sự kiện làm mới cache cùng transaction.
      parameters: [ { $ref: '#/components/parameters/ShowtimeId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seat_ids, reason]
              properties:
                seat_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  pattern: '[\s\S]*\S[\s\S]*'
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SEAT_TAKEN, EVENT_LOCKED hoặc SHOWTIME_LOCKED.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Ghế đang giữ hoặc đã bán, status: 409, code: SEAT_TAKEN, detail: Danh sách chưa được thay đổi. }
  /admin/showtimes/{showtime_id}/seats/unblock:
    post:
      operationId: unblockSeats
      tags: [Admin Catalog]
      summary: unblock seats
      description: >
        ADMIN thay đổi ghế theo suất, nguyên tử toàn bộ danh sách; hỗ trợ suất DRAFT.
        AVAILABLE hoặc HELD có held_until < giờ hiện tại được khóa; HELD còn hạn và SOLD trả SEAT_TAKEN.
        Mở khóa chỉ chấp nhận BLOCKED hoặc AVAILABLE. Gửi lại trạng thái đích thành công, không ghi thêm lịch sử.
        Không tự thêm ghế cặp. Ghế ngoài sơ đồ, danh sách rỗng/trùng/null trả VALIDATION_ERROR.
        Event ENDED/CANCELLED trả EVENT_LOCKED; suất CANCELLED hoặc đã kết thúc trả SHOWTIME_LOCKED.
        Lý do khóa được lưu; dữ liệu và sự kiện làm mới cache cùng transaction.
      parameters: [ { $ref: '#/components/parameters/ShowtimeId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seat_ids]
              properties:
                seat_ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SEAT_TAKEN, EVENT_LOCKED hoặc SHOWTIME_LOCKED.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { title: Ghế đang giữ hoặc đã bán, status: 409, code: SEAT_TAKEN, detail: Danh sách chưa được thay đổi. }

  # ------------------------------------------------------------------ Admin Operations
  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [Admin Operations]
      summary: Tra cứu đơn
      description: |
        Chỉ ADMIN; đọc đơn của mọi buyer, không thay đổi dữ liệu. Các bộ lọc kết hợp bằng AND;
        event_id lọc theo showtime.event_id. Sắp xếp created_at DESC, id DESC;
        phân trang keyset như GET /orders, next_cursor null ở trang cuối, limit từ 1 đến 100.
        q sau trim phải dài 3–254 ký tự và khớp CHÍNH XÁC một trong: mã đơn
        (upper(code) = upper(q)), email (lower(buyer_email) = lower(q)),
        hoặc SĐT (buyer_phone = q, giữ nguyên định dạng). Không dùng LIKE; % và _ là ký tự thường.
        Không log q. q sai độ dài, cursor hỏng hoặc limit ngoài khoảng → 400 VALIDATION_ERROR.
        Ví dụ lỗi q: {"status":400,"code":"VALIDATION_ERROR","detail":"q sau trim phải dài 3–254 ký tự"}.
        Ví dụ cursor hỏng: {"status":400,"code":"VALIDATION_ERROR","detail":"Cursor không hợp lệ"}.
        Ví dụ limit sai: {"status":400,"code":"VALIDATION_ERROR","detail":"limit phải từ 1 đến 100"}.
        Thiếu token: {"status":401,"code":"UNAUTHORIZED"}; BUYER: {"status":403,"code":"FORBIDDEN"}.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: event_id, in: query, schema: { type: string, format: uuid } }
        - { name: showtime_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: 'Khớp chính xác mã đơn/email không phân biệt hoa thường hoặc SĐT nguyên văn; trim rồi kiểm tra 3–254 ký tự', schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/orders/{order_id}:
    get:
      operationId: adminGetOrder
      tags: [Admin Operations]
      summary: Chi tiết đơn, lịch sử trạng thái và các giao dịch
      description: |
        Chỉ ADMIN; đọc đơn của mọi buyer gồm items, buyer, payments và history, không thay đổi dữ liệu.
        payments sắp xếp created_at ASC, id ASC; last_response_code lấy từ payment_transaction
        mới nhất theo received_at của từng intent. Không có payment thì payments là mảng rỗng.
        Không trả payment_url của PaymentIntent (không có trường hoặc null), không lộ URL thanh toán.
        history sắp xếp at ASC, id ASC; actor là email của order_status_history.actor_id
        (JOIN users), hoặc "SYSTEM" khi actor_id NULL.
        Thiếu token: {"status":401,"code":"UNAUTHORIZED"}; BUYER: {"status":403,"code":"FORBIDDEN"}.
        Đơn không tồn tại: {"status":404,"code":"NOT_FOUND","detail":"Không tìm thấy đơn"}.
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Order'
                  - type: object
                    properties:
                      payments:
                        type: array
                        items: { $ref: '#/components/schemas/PaymentIntent' }
                      history:
                        type: array
                        items:
                          type: object
                          properties:
                            status: { $ref: '#/components/schemas/OrderStatus' }
                            at: { type: string, format: date-time }
                            actor: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/orders/{order_id}/resolve-review:
    post:
      operationId: resolveReview
      tags: [Admin Operations]
      summary: Xử lý đơn NEEDS_REVIEW
      description: |
        Chỉ ADMIN; bắt buộc Idempotency-Key và reason. Khoá đơn FOR UPDATE, chỉ xử lý NEEDS_REVIEW.
        Cùng key và body trả kết quả cũ; cùng key khác body → IDEMPOTENCY_CONFLICT.
        ISSUE_TICKETS phải lấy lại toàn bộ tồn kho cũ theo order_item, không đổi ghế:
        ghế AVAILABLE hoặc HELD quá hạn (held_until < now) → SOLD với order_id của đơn;
        khu đứng tăng sold theo quantity khi capacity - sold - held đủ. Thiếu ghế → SEAT_TAKEN
        (không kèm gợi ý ghế), thiếu khu đứng → NOT_ENOUGH_STOCK; rollback toàn bộ thao tác.
        Suất đã diễn (ends_at <= now) hoặc CANCELLED → ORDER_STATE_INVALID; đã đóng bán
        nhưng chưa diễn vẫn được xử lý. Thành công chuyển đơn PAID, paid_at = now, ghi history
        NEEDS_REVIEW → PAID với actor_id admin và reason, phát vé cùng ticket.issued,
        order.paid và email vé qua outbox nếu có buyer_email; thiếu email vẫn thành công.
        REFUND chỉ đánh dấu REFUNDED sau khi admin hoàn thủ công trên VNPay, ghi history;
        không gọi API hoàn tiền và không giải phóng tồn kho vì đơn không còn giữ.
        Mọi thay đổi, history, audit_log trước/sau, outbox và realtime nằm trong cùng transaction.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [ISSUE_TICKETS, REFUND], description: 'REFUND chỉ đánh dấu đơn REFUNDED sau khi admin đã hoàn tiền thủ công trên cổng VNPay. Hệ thống không gọi API hoàn tiền.' }
                reason: { type: string }
      responses:
        '200':
          description: Đơn chuyển PAID (đã phát vé) hoặc REFUNDED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: ORDER_STATE_INVALID (đơn không NEEDS_REVIEW hoặc suất đã diễn/huỷ), SEAT_TAKEN, NOT_ENOUGH_STOCK hoặc IDEMPOTENCY_CONFLICT.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                invalidOrder:
                  value: { title: Trạng thái đơn không hợp lệ, status: 409, code: ORDER_STATE_INVALID, detail: Đơn không ở trạng thái NEEDS_REVIEW. }
                finishedOrCancelled:
                  value: { title: Suất không thể phát vé, status: 409, code: ORDER_STATE_INVALID, detail: Suất đã diễn hoặc đã bị huỷ. }
                seatTaken:
                  value: { title: Ghế không còn trống, status: 409, code: SEAT_TAKEN, detail: Không thể lấy lại toàn bộ ghế cũ của đơn. }
                notEnoughStock:
                  value: { title: Khu đứng không đủ chỗ, status: 409, code: NOT_ENOUGH_STOCK, detail: Tồn kho còn lại nhỏ hơn quantity của đơn. }
                idempotencyConflict:
                  value: { title: Idempotency-Key xung đột, status: 409, code: IDEMPOTENCY_CONFLICT, detail: Key đã được dùng với body khác. }
  /admin/orders/{order_id}/reconcile:
    post:
      operationId: reconcileOrder
      tags: [Admin Operations]
      summary: Gọi querydr ngay để đối soát với VNPay
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: Kết quả sau đối soát
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
  /admin/tickets:
    get:
      operationId: adminListTickets
      tags: [Admin Operations]
      summary: Tra cứu vé
      description: |
        Chỉ ADMIN; đọc vé của mọi buyer, không thay đổi dữ liệu. Các bộ lọc kết hợp bằng AND;
        code khớp chính xác, không phân biệt hoa thường, không dùng LIKE.
        Sắp xếp issued_at DESC, id DESC; phân trang keyset như GET /tickets,
        next_cursor null ở trang cuối, limit từ 1 đến 100.
        Admin KHÔNG BAO GIỜ nhận qr_token: mọi vé đều không có trường hoặc null,
        kể cả vé ISSUED và kể cả admin là chủ vé.
        Ví dụ cursor hỏng: {"status":400,"code":"VALIDATION_ERROR","detail":"Cursor không hợp lệ"}.
        Ví dụ limit sai: {"status":400,"code":"VALIDATION_ERROR","detail":"limit phải từ 1 đến 100"}.
        Thiếu token: {"status":401,"code":"UNAUTHORIZED"}; BUYER: {"status":403,"code":"FORBIDDEN"}.
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { name: showtime_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TicketStatus' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/tickets/{ticket_id}/void:
    post:
      operationId: voidTicket
      tags: [Admin Operations]
      summary: Vô hiệu vé (bắt buộc lý do)
      description: |
        Chỉ ADMIN; reason ít nhất 3 ký tự. Khoá vé FOR UPDATE trước khi kiểm trạng thái.
        Chỉ ISSUED → VOID, đặt voided_at, không trả qr_token; ghế vẫn SOLD, không mở bán lại.
        USED → TICKET_USED, VOID → TICKET_NOT_VALID. Ghi audit VOID_TICKET cùng transaction,
        gồm admin, thời điểm, reason và status trước/sau; QR cũ không còn dùng để vào cổng.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TICKET_USED nếu vé đã dùng; TICKET_NOT_VALID nếu vé VOID.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                used:
                  value: { title: Vé đã sử dụng, status: 409, code: TICKET_USED, detail: Chỉ vô hiệu vé ISSUED. }
                void:
                  value: { title: Vé không còn hiệu lực, status: 409, code: TICKET_NOT_VALID, detail: Vé đã bị vô hiệu. }
  /admin/tickets/{ticket_id}/reissue-qr:
    post:
      operationId: reissueTicketQr
      tags: [Admin Operations]
      summary: Sinh qr_token mới, QR cũ mất hiệu lực
      description: |
        Chỉ ADMIN; reason ít nhất 3 ký tự. Khoá vé FOR UPDATE; chỉ vé ISSUED được cấp lại QR.
        Chỉ đổi qr_token bằng 32 byte SecureRandom mã hoá base64url; Ticket trả về KHÔNG có qr_token
        (admin không nhận QR vào cổng), khách nhận QR mới qua gửi lại vé. QR cũ không còn tìm thấy. USED → TICKET_USED, VOID → TICKET_NOT_VALID.
        Ghi audit REISSUE_QR cùng transaction với status ISSUED trước/sau, không lưu qr_token.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TICKET_USED nếu vé đã dùng; TICKET_NOT_VALID nếu vé VOID.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                used:
                  value: { title: Vé đã sử dụng, status: 409, code: TICKET_USED, detail: Chỉ cấp lại QR cho vé ISSUED. }
                void:
                  value: { title: Vé không còn hiệu lực, status: 409, code: TICKET_NOT_VALID, detail: Vé đã bị vô hiệu. }
  /admin/tickets/{ticket_id}/resend:
    post:
      operationId: adminResendTicket
      tags: [Admin Operations]
      summary: Gửi lại vé tới email trên đơn
      description: |
        Chỉ ADMIN, không rate limit. Khoá vé FOR UPDATE; chỉ vé ISSUED được gửi.
        USED → TICKET_USED, VOID → TICKET_NOT_VALID; không có buyer_email → ORDER_STATE_INVALID.
        Ghi email qua outbox và audit RESEND_TICKET trong cùng transaction:
        before null, after chứa outbox_id, không lưu email trong audit.
      parameters: [ { $ref: '#/components/parameters/TicketId' } ]
      responses:
        '202': { description: Đã đưa vào hàng đợi }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: TICKET_USED, TICKET_NOT_VALID hoặc ORDER_STATE_INVALID khi đơn không có email.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              examples:
                used:
                  value: { title: Vé đã sử dụng, status: 409, code: TICKET_USED, detail: Chỉ gửi lại vé ISSUED. }
                void:
                  value: { title: Vé không còn hiệu lực, status: 409, code: TICKET_NOT_VALID, detail: Vé đã bị vô hiệu. }
                noEmail:
                  value: { title: Đơn không có email, status: 409, code: ORDER_STATE_INVALID, detail: Đơn không có buyer_email để gửi vé. }
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [Admin Operations]
      summary: Nhật ký thao tác của admin
      description: Chỉ ADMIN; lọc entity và entity_id, mới nhất trước theo at DESC rồi id DESC. Phân trang keyset cursor, limit từ 1 đến 100; limit hoặc cursor sai trả 400.
      parameters:
        - { name: entity, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ Admin Reports
  /admin/reports/metrics:
    get:
      operationId: queryMetric
      tags: [Admin Reports]
      summary: Số liệu bán vé và check-in (dùng cho Admin Copilot)
      description: |
        Tính trên dữ liệu hiện tại; lọc thời gian theo [from,to), mỗi mốc có thể bỏ qua.
        Nhóm day/hour theo UTC; tier/zone theo UUID hạng vé/khu vực.
        tickets_sold là tổng quantity của đơn PAID, theo paid_at.
        revenue là tổng quantity * unit_price của đơn PAID, theo paid_at, đơn vị VND.
        checkins đếm các vé USED khác nhau của đơn PAID, theo lần quét OK đầu tiên.
        fill_rate = 100 * tổng sold / tổng capacity, theo starts_at; mẫu bằng 0 trả 0.
        group_by=none trả value; các nhóm khác trả series, nhóm không có dữ liệu trả [].
        Ví dụ 400 khi from không trước to:
        {"status":400,"code":"VALIDATION_ERROR","detail":"from must be earlier than to"}
        Ví dụ 401 khi thiếu token: {"status":401,"code":"UNAUTHORIZED"}.
        Ví dụ 403 khi người dùng không có vai trò ADMIN: {"status":403,"code":"FORBIDDEN"}.
      parameters:
        - name: metric
          in: query
          required: true
          schema: { type: string, enum: [tickets_sold, revenue, fill_rate, checkins] }
        - { name: event_id, in: query, schema: { type: string, format: uuid } }
        - { name: showtime_id, in: query, schema: { type: string, format: uuid } }
        - { name: price_tier_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: group_by, in: query, schema: { type: string, enum: [none, day, hour, tier, zone], default: none } }
      responses:
        '200':
          description: OK
          content:
            application/json:
                schema: { $ref: '#/components/schemas/MetricResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    EventId: { name: event_id, in: path, required: true, schema: { type: string, format: uuid } }
    ShowtimeId: { name: showtime_id, in: path, required: true, schema: { type: string, format: uuid } }
    OrderId: { name: order_id, in: path, required: true, schema: { type: string, format: uuid } }
    TicketId: { name: ticket_id, in: path, required: true, schema: { type: string, format: uuid } }
    VenueId: { name: venue_id, in: path, required: true, schema: { type: string, format: uuid } }
    ConversationId: { name: conversation_id, in: path, required: true, schema: { type: string, format: uuid } }
    ActionId: { name: action_id, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID do client sinh; lưu 24 giờ
      schema: { type: string, format: uuid }

  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: { type: string, minLength: 3 }

  responses:
    ValidationError:
      description: VALIDATION_ERROR
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: UNAUTHORIZED
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            title: Chưa đăng nhập
            status: 401
            code: UNAUTHORIZED
            detail: Thiếu hoặc sai access token
    Forbidden:
      description: FORBIDDEN
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: NOT_FOUND
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GoogleLoginDisabled:
      description: Đăng nhập Google chưa được bật
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { title: Không tìm thấy, status: 404, code: NOT_FOUND, detail: Đăng nhập Google chưa được bật }
    RateLimited:
      description: RATE_LIMITED (kèm header Retry-After)
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          enum: [VALIDATION_ERROR, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, INVALID_CREDENTIALS, ACCOUNT_LOCKED,
                 EMAIL_TAKEN, PHONE_TAKEN, OTP_INVALID, OTP_EXPIRED, OTP_TOO_MANY_ATTEMPTS,
                 SERVICE_UNAVAILABLE, SEAT_TAKEN, NOT_ENOUGH_STOCK, SHOWTIME_NOT_ON_SALE, ORDER_STATE_INVALID, HOLD_EXPIRED,
                 PROFILE_REQUIRED, MAX_TICKETS_EXCEEDED, IDEMPOTENCY_CONFLICT, TICKET_NOT_VALID, TICKET_USED,
                 VENUE_IN_USE, HALL_NAME_TAKEN, UNSUPPORTED_MEDIA_TYPE, INVALID_SEAT_LAYOUT, SEAT_LAYOUT_LOCKED, EVENT_LOCKED, EVENT_INCOMPLETE,
                 SHOWTIME_LOCKED, ACTION_STATE_INVALID, RATE_LIMITED]
        errors:
          type: array
          description: Lỗi theo field (VALIDATION_ERROR)
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
      additionalProperties: true
    SeatLayoutImportProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [issues]
          properties:
            issues:
              type: array
              minItems: 1
              items:
                type: object
                required: [reason, message]
                properties:
                  layer_id:
                    type: string
                    description: ID layer trong SVG nếu xác định được.
                  reason:
                    type: string
                    description: Mã nguyên nhân của lỗi, ví dụ DUPLICATE_SEAT.
                  message:
                    type: string
                    description: Thông báo để admin biết cần sửa gì trong Figma.
    Page:
      type: object
      properties:
        next_cursor: { type: [string, 'null'] }

    RegisterRequest:
      type: object
      required: [full_name, email, phone, password]
      properties:
        full_name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        phone: { type: string, pattern: '^\+?[0-9]{9,15}$' }
        password: { type: string, minLength: 8 }
    OtpSession:
      type: object
      properties:
        otp_session_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        channel: { type: string, enum: [EMAIL, SMS] }
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Giây }
        user: { $ref: '#/components/schemas/User' }
    RefreshResult:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string, description: Chỉ có khi refresh token được gửi trong JSON }
        expires_in: { type: integer, description: Giây }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        phone: { type: string }
        full_name: { type: string }
        avatar_url: { type: string, format: uri }
        role: { type: string, enum: [BUYER, ADMIN] }
        status: { type: string, enum: [UNVERIFIED, ACTIVE, LOCKED, DELETED] }
    BuyerProfile:
      type: object
      required: [full_name, phone, email]
      properties:
        full_name: { type: string }
        phone: { type: string }
        email: { type: string, format: email, description: Email nhận vé }

    CityCode:
      type: string
      enum: [HCM, HN, DN]
      description: |
        Mã thành phố (danh sách tạm, catalog sẽ chốt). Backend không tự đổi tên sang mã; agent tự map tên người dùng nói sang mã:
        HCM: TP. Hồ Chí Minh, Sài Gòn, HCMC;
        HN: Hà Nội, Hanoi;
        DN: Đà Nẵng, Da Nang.
    EventCategory: { type: string, enum: [FOOTBALL, CONCERT, THEATER, OTHER] }
    EventStatus: { type: string, enum: [DRAFT, PUBLISHED, ENDED, CANCELLED] }
    ShowtimeStatus: { type: string, enum: [DRAFT, SCHEDULED, ON_SALE, SALES_CLOSED, FINISHED, CANCELLED] }
    SeatStatus: { type: string, enum: [AVAILABLE, HELD, SOLD, BLOCKED] }
    OrderStatus: { type: string, enum: [PENDING, PAID, EXPIRED, CANCELLED, NEEDS_REVIEW, REFUNDED] }
    PaymentStatus: { type: string, enum: [OPEN, SUCCEEDED, FAILED, EXPIRED] }
    TicketStatus: { type: string, enum: [ISSUED, USED, VOID] }

    Venue:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [STADIUM, THEATER, OUTDOOR] }
        address: { type: string }
        city: { $ref: '#/components/schemas/CityCode' }
        city_name: { type: string, description: Tên hiển thị của thành phố }
        district: { type: string }
        lat: { type: number }
        lng: { type: number }
        info:
          type: object
          properties:
            opening_hours: { type: string }
            rules: { type: string }
            parking: { type: string }
        halls:
          type: array
          items: { $ref: '#/components/schemas/Hall' }
    VenueInput:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [STADIUM, THEATER, OUTDOOR] }
        address: { type: string }
        city: { $ref: '#/components/schemas/CityCode' }
        district: { type: string }
        lat: { type: number }
        lng: { type: number }
        info: { type: object }
    VenueCreateInput:
      allOf:
        - $ref: '#/components/schemas/VenueInput'
        - type: object
          required: [name, type, address, city]
    Hall:
      type: object
      properties:
        id: { type: string, format: uuid }
        venue_id: { type: string, format: uuid }
        name: { type: string }
    SeatLayoutInput:
      type: object
      required: [name, zones]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, pattern: '[\s\S]*\S[\s\S]*' }
        zones:
          type: array
          items:
            type: object
            required: [name, kind]
            properties:
              name: { type: string }
              kind: { type: string, enum: [SEATED, STANDING] }
              capacity: { type: integer, description: Bắt buộc với STANDING }
              rows:
                type: array
                items:
                  type: object
                  properties:
                    row: { type: string }
                    seats:
                      type: array
                      items:
                        type: object
                        properties:
                          number: { type: integer }
                          seat_type: { type: string, enum: [STANDARD, COUPLE, WHEELCHAIR] }
                          x: { type: number }
                          y: { type: number }
                    aisle_after: { type: array, items: { type: integer } }
        seat_pairs:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string, description: 'Mã ghế, ví dụ "A-F9"' }
    SeatLayoutNameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200, pattern: '[\s\S]*\S[\s\S]*', example: 'Bóng đá' }
    SeatLayout:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200, description: Tên cấu hình; các phiên bản được phép trùng tên. }
        hall_id: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, PUBLISHED] }
        zone_count: { type: integer }
        seat_count: { type: integer }
        version: { type: integer, format: int64, minimum: 1 }
        schema_version: { type: integer, minimum: 1 }
        published_at: { type: string, format: date-time }
    SeatLayoutBounds:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }

    SeatLayoutZone:
      type: object
      required: [id, code, label, kind, capacity]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        label: { type: string }
        stand_code: { type: string }
        level: { type: integer, minimum: 1 }
        kind: { type: string, enum: [SEATED, STANDING] }
        capacity: { type: integer, minimum: 0 }
        svg_id: { type: string }
        content_svg_id: { type: string }
        pitch_side_svg_id: { type: string }
        bounds: { $ref: '#/components/schemas/SeatLayoutBounds' }

    SeatLayoutZoneDetail:
      allOf:
        - $ref: '#/components/schemas/SeatLayoutZone'
        - type: object
          properties:
            rows:
              type: array
              description: Danh sách hàng của khu SEATED. Bỏ trường này với khu STANDING.
              items:
                type: object
                required: [row_label, seats]
                properties:
                  row_label: { type: string }
                  seats:
                    type: array
                    items:
                      type: object
                      required: [id, number, x, y]
                      properties:
                        id: { type: string, format: uuid }
                        number: { type: integer, minimum: 1 }
                        x: { type: number }
                        y: { type: number }

    SeatLayoutOverview:
      allOf:
        - $ref: '#/components/schemas/SeatLayout'
        - type: object
          required: [zones]
          properties:
            view_box: { $ref: '#/components/schemas/SeatLayoutBounds' }
            zones:
              type: array
              items: { $ref: '#/components/schemas/SeatLayoutZone' }

    SeatLayoutPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: '#/components/schemas/SeatLayout' }
    AdminEventSummary:
      type: object
      required: [id, title, category, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        category:
          $ref: '#/components/schemas/EventCategory'
        status:
          $ref: '#/components/schemas/EventStatus'
        poster_mobile_url:
          type: string
          format: uri
        poster_desktop_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminEventPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminEventSummary'
        next_cursor:
          type: [string, 'null']
          description: Cursor trang tiếp theo; null khi hết dữ liệu.
    EventInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
        description:
          type: string
        category:
          $ref: '#/components/schemas/EventCategory'
        attributes:
          type: object
          description: 'Thuộc tính theo loại, ví dụ FOOTBALL: home_team, away_team, league, round'
        poster_mobile_url:
          type: string
          format: uri
          description: URL tuyệt đối HTTP hoặc HTTPS của poster mobile.
        poster_desktop_url:
          type: string
          format: uri
          description: URL tuyệt đối HTTP hoặc HTTPS của poster desktop.
        age_limit:
          type: integer
          minimum: 0
          description: Độ tuổi tối thiểu hiển thị trên thông tin sự kiện.
        max_tickets_per_order:
          type: integer
          minimum: 1
          maximum: 20
    EventPatchInput:
      type: object
      description: Không có default. Thuộc tính không gửi hoặc null được giữ nguyên; không hỗ trợ xóa giá trị bằng null.
      properties:
        title:
          type: [string, 'null']
          minLength: 1
          pattern: '[\s\S]*\S[\s\S]*'
        description:
          type: [string, 'null']
        category:
          type: [string, 'null']
          pattern: '^(FOOTBALL|CONCERT|THEATER|OTHER)$'
          description: FOOTBALL, CONCERT, THEATER hoặc OTHER; null giữ nguyên.
        attributes:
          type: [object, 'null']
        poster_mobile_url:
          type: [string, 'null']
          format: uri
          description: URL tuyệt đối HTTP/HTTPS có host; null giữ nguyên.
        poster_desktop_url:
          type: [string, 'null']
          format: uri
          description: URL tuyệt đối HTTP/HTTPS có host; null giữ nguyên.
        age_limit:
          type: [integer, 'null']
          minimum: 0
        max_tickets_per_order:
          type: [integer, 'null']
          minimum: 1
          maximum: 20
    EventCreateInput:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          required: [title, category]
          properties:
            max_tickets_per_order:
              type: integer
              minimum: 1
              maximum: 20
              default: 10
    EventSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        category: { $ref: '#/components/schemas/EventCategory' }
        poster_url: { type: string, format: uri }
        venue_name: { type: string }
        city: { $ref: '#/components/schemas/CityCode' }
        city_name: { type: string, description: Tên hiển thị của thành phố }
        first_starts_at: { type: string, format: date-time }
        price_from: { type: integer, format: int64 }
        on_sale: { type: boolean }
    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/EventStatus' }
            venue: { $ref: '#/components/schemas/Venue' }
            price_tiers:
              type: array
              items: { $ref: '#/components/schemas/PriceTier' }
            showtimes:
              type: array
              items: { $ref: '#/components/schemas/Showtime' }
    PriceTierInput:
      type: object
      required: [name, price]
      properties:
        id:
          type: string
          format: uuid
          description: >
            ID hạng giá hiện có của sự kiện khi cập nhật.
            Nếu không gửi, dùng lại hạng cùng tên sau khi bỏ
            khoảng trắng hoặc tạo mới nếu chưa có.
        name:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '[\s\S]*\S[\s\S]*'
          example: VIP
        price:
          type: integer
          format: int64
          minimum: 0
          description: Giá một vé, đơn vị VND.
          example: 500000
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          example: '#C8A2C8'

    ZonePriceInput:
      type: object
      required: [zone_id, price_tier_id]
      properties:
        zone_id:
          type: string
          format: uuid
          description: Khu thuộc layout đang được suất chưa hủy của sự kiện sử dụng.
        price_tier_id:
          type: string
          format: uuid
          description: Hạng giá thuộc đúng sự kiện.
    PriceTier:
      type: object
      required: [name, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        price: { type: integer, format: int64, minimum: 0 }
        color: { type: string, example: '#C8A2C8' }
    ShowtimeInput:
      type: object
      properties:
        hall_id: { type: string, format: uuid }
        seat_layout_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        sale_opens_at: { type: string, format: date-time }
        sale_closes_at: { type: string, format: date-time }
    Showtime:
      allOf:
        - $ref: '#/components/schemas/ShowtimeInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            event_id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/ShowtimeStatus' }
            sold_out: { type: boolean }
            venue: { $ref: '#/components/schemas/Venue' }
    SeatMap:
      type: object
      properties:
        showtime_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ShowtimeStatus' }
        zones:
          type: array
          items:
            type: object
            properties:
              zone_id: { type: string, format: uuid }
              name: { type: string }
              kind: { type: string, enum: [SEATED, STANDING] }
              tier: { $ref: '#/components/schemas/PriceTier' }
              seats_left: { type: integer, description: Chỉ với STANDING }
              seats:
                type: array
                items:
                  type: object
                  properties:
                    seat_id: { type: string, format: uuid }
                    row: { type: string }
                    number: { type: integer }
                    seat_type: { type: string, enum: [STANDARD, COUPLE, WHEELCHAIR] }
                    pair_seat_id: { type: [string, 'null'], format: uuid }
                    status: { $ref: '#/components/schemas/SeatStatus' }
                    x: { type: number }
                    y: { type: number }

    HoldRequest:
      type: object
      description: |
        Gửi đúng một trong hai dạng: seat_ids cho khu ngồi hoặc zone_id + quantity cho khu đứng.
        Gửi cả hai dạng, không gửi dạng nào, zone_id thiếu quantity hoặc quantity thiếu zone_id → 400 VALIDATION_ERROR.
        seat_ids nếu gửi thì không được rỗng; service kiểm tra, rỗng → 400 VALIDATION_ERROR.
        Ghế đôi tự giữ kèm ghế cặp.
      properties:
        seat_ids:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 20 }
      example:
        seat_ids: ['019a71b0-0000-7000-8000-000000000001']
    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        zone: { type: string }
        row: { type: [string, 'null'] }
        number: { type: [integer, 'null'] }
        seat_id: { type: [string, 'null'], format: uuid }
        tier: { type: string }
        unit_price: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1, description: 'Số vé của dòng: ghế ngồi luôn 1, khu đứng là số chỗ đã giữ' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: 8F3K2Q }
        status: { $ref: '#/components/schemas/OrderStatus' }
        event: { $ref: '#/components/schemas/EventSummary' }
        showtime: { $ref: '#/components/schemas/Showtime' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        total_amount: { type: integer, format: int64 }
        currency: { type: string, const: VND }
        expires_at: { type: string, format: date-time, description: Hạn giữ ghế khi PENDING }
        paid_at: { type: [string, 'null'], format: date-time }
        buyer: { $ref: '#/components/schemas/BuyerProfile' }
        review_reason: { type: [string, 'null'], enum: [PAID_AFTER_EXPIRY, PAID_AFTER_CANCEL, AMOUNT_MISMATCH, null] }
        created_at: { type: string, format: date-time }
    PaymentIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        txn_ref: { type: string, example: 8F3K2Q-1 }
        amount: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        payment_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        last_response_code: { type: [string, 'null'] }

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: 'Mã ngắn để tra cứu, không dùng vào cổng' }
        status: { $ref: '#/components/schemas/TicketStatus' }
        qr_token: { type: [string, 'null'], description: Chỉ trả khi ISSUED và người gọi là chủ vé }
        order_code: { type: string }
        event: { $ref: '#/components/schemas/EventSummary' }
        showtime: { $ref: '#/components/schemas/Showtime' }
        venue: { $ref: '#/components/schemas/Venue' }
        zone: { type: string }
        row: { type: [string, 'null'] }
        number: { type: [integer, 'null'] }
        tier: { type: string }
        used_at: { type: [string, 'null'], format: date-time }
    CheckinResult:
      type: object
      properties:
        result: { type: string, enum: [OK, ALREADY_USED, TICKET_VOID, WRONG_SHOWTIME] }
        ticket_code: { type: string }
        zone: { type: string }
        row: { type: [string, 'null'] }
        number: { type: [integer, 'null'] }
        scanned_at: { type: string, format: date-time }
        first_used_at: { type: [string, 'null'], format: date-time, description: Khi ALREADY_USED }

    Conversation:
      type: object
      properties:
        id: { type: string, format: uuid }
        agent: { type: string, enum: [BUYER_AGENT, ADMIN_COPILOT] }
        created_at: { type: string, format: date-time }
    ChatBlock:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [SeatMap, OrderSummary, PaymentQR, Ticket, ConfirmAction, StatCards, Chart, EventList] }
        payload: { type: object }
    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        text: { type: string }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/ChatBlock' }
        created_at: { type: string, format: date-time }
    StreamEvent:
      type: object
      description: Một sự kiện SSE (dòng event + data JSON)
      properties:
        event:
          type: string
          enum: [order.held, order.paid, order.expired, order.needs_review, payment.failed, ticket.issued, chat.delta, chat.block, chat.done]
        id: { type: string }
        data: { type: object }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        action: { type: string, enum: [VOID_TICKET, REISSUE_QR, RESEND_TICKET, RESOLVE_REVIEW, BLOCK_SEATS, CANCEL_EVENT, CANCEL_SHOWTIME] }
        entity: { type: string }
        entity_id: { type: string, format: uuid }
        reason: { type: string }
        via_agent: { type: boolean, description: Thao tác do Admin Copilot thực hiện sau khi được duyệt }
        at: { type: string, format: date-time }
        before: { type: [object, 'null'], description: Trạng thái liên quan trước thao tác }
        after: { type: [object, 'null'], description: Trạng thái liên quan sau thao tác }
    MetricResult:
      type: object
      properties:
        metric: { type: string }
        unit: { type: string, enum: [tickets, VND, percent, checkins] }
        filters: { type: object, description: 'Bộ lọc đã áp dụng, để hiển thị cho admin' }
        computed_at: { type: string, format: date-time }
        value: { type: number, description: Khi group_by = none }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: number }
        definition: { type: string, description: 'Cách tính, ví dụ fill_rate = sold / capacity' }
