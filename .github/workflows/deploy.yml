name: deploy

# merge main → build image → GHCR → chạy lại container web trên staging
# Server staging dùng chung với vingo-backend (~/vingo, compose + Caddy bên repo đó).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
          tags: |
            ghcr.io/tntd-dev/vingo-web:${{ steps.meta.outputs.tag }}
            ghcr.io/tntd-dev/vingo-web:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Runner riêng của repo này, đặt chung máy với runner của vingo-backend
    # (chỉ máy đó SSH được vào IP private của server).
    runs-on: [self-hosted, linux, x64, aws]
    environment: staging
    steps:
      - name: SSH vào server, kéo image web và chạy lại
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if [ -z "$HOST" ]; then echo "Chưa cấu hình DEPLOY_HOST cho environment này, bỏ qua deploy."; exit 0; fi
          install -m 600 /dev/null key && echo "$SSH_KEY" > key
          trap 'rm -f key' EXIT
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" "TAG=$TAG bash -s" <<'EOF'
          set -e
          cd ~/vingo
          # Khoá chung với deploy của vingo-backend: job nào tới sau thì đợi (tối đa 5 phút).
          exec 9>~/vingo/.deploy.lock
          flock -w 300 9
          export WEB_TAG="$TAG"
          docker compose pull web
          docker compose up -d --no-deps web
          DOMAIN=$(grep '^DOMAIN=' .env | cut -d= -f2)
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$DOMAIN/" | grep -q 'id="root"'; then
              echo "web UP sau $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "web chưa lên sau 60s"
          docker compose ps web
          docker compose logs --tail 30 web
          exit 1
          EOF
